# Path: docker-compose.yaml
services:
  # DEV DB (Port 5432)
  db_dev:
    image: pgvector/pgvector:pg15
    container_name: onyx_postgres_dev
    restart: unless-stopped
    environment:
      - POSTGRES_USER=aleksa
      - POSTGRES_PASSWORD=Izvoria16
      - POSTGRES_DB=onyx_dev_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql

  # TEST DB (Port 5433)
  db_test:
    image: pgvector/pgvector:pg15
    container_name: onyx_postgres_test
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=onyx_test_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_dev_data:
  postgres_test_data: