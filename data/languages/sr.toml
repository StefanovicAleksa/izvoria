# Serbian language pack.
#
# Serbian is written in Cyrillic and Latin, and Whisper emits either. Everything -- transcript, index and
# queries -- is normalised to Latin (`script = "latin"`): Cyrillic -> Latin is exact, the reverse is not.

code = "sr"
name = "Serbian"
native_name = "Srpski"

[transcription]
whisper_language = "sr"
# Whisper's language ID routinely labels Serbian speech as Croatian or Bosnian; all three are accepted so the
# guard only rejects a file that is genuinely in another language.
accepted_detections = ["sr", "hr", "bs"]
min_detection_probability = 0.5
script = "latin"
# Seed list: subtitle credits and channel outros Whisper is known to invent over silence in South Slavic
# audio. Confirm against real Serbian transcripts before relying on it -- a pattern here deletes a segment.
hallucination_patterns = [
    '(?i)(titlovao|titlovala|titlovi\s*:|prevod i obrada|preveo\s*:|prevela\s*:)',
    '(?i)(titlovi\.com|prevodi\.org)',
    '(?i)(pretplatite se|hvala (vam )?(što ste|sto ste) gledali|hvala na gledanju)',
]

[punctuation]
# The fullstop classifier was never trained on Serbian; Whisper large-v3 punctuates Serbian itself.
source = "whisper"

[search]
# Postgres' Snowball Serbian stemmer; it stems both scripts and both (ekavian/ijekavian) variants to one stem.
fts_config = "serbian"

[text]
citation_joiners = ["i"]
stopwords = [
    "a", "ako", "ali", "bi", "bih", "bila", "bile", "bili", "bilo", "bio", "bismo", "biste", "biti", "će", "ćemo",
    "ćete", "ćeš", "ću", "čak", "da", "do", "dok", "duž", "ga", "gde", "gdje", "i", "ih", "ili", "iz", "iza",
    "ja", "je", "jer", "jesam", "jesmo", "jeste", "jesu", "joj", "još", "ju", "kad", "kada", "kako", "kao", "koja",
    "koje", "koji", "kojih", "kojim", "koju", "li", "me", "mene", "meni", "mi", "mnogo", "mu", "na", "nad", "nam",
    "nas", "naš", "naša", "naše", "ne", "nego", "neki", "nešto", "ni", "nije", "nisam", "nisu", "niti", "njega",
    "njemu", "njen", "njih", "njihov", "njoj", "nju", "o", "od", "oko", "on", "ona", "one", "oni", "ono", "ova",
    "ovaj", "ove", "ovi", "ovo", "pa", "po", "pod", "pre", "preko", "pri", "prije", "sa", "sam", "samo", "se",
    "sebe", "si", "smo", "ste", "su", "sve", "svi", "šta", "što", "ta", "tada", "taj", "tako", "te", "ti", "to",
    "toga", "tome", "u", "uz", "vam", "vas", "već", "vi", "za", "zato",
]

[phonetic]
alphabet = "a-zčćđšž"
# Serbian spelling is phonemic, so the key only needs the letters Whisper confuses to collapse together
# (č/ć, dž/đ). Applied in order, so "dž" is folded before its "ž".
fold = { "dž" = "dj", "č" = "c", "ć" = "c", "đ" = "dj", "š" = "s", "ž" = "z" }
# Digraphs collapse to their main sound, then voiced and voiceless pairs share one symbol
rewrites = [
    ['dj', 'j'], ['lj', 'l'], ['nj', 'n'],
    ['d', 't'], ['b', 'p'], ['g', 'k'], ['v', 'f'], ['z', 's'],
]
silent_letters = "aeiou"
head_vowels = "eiou"
# No plural or verb-ending handling: a replacement can't reproduce case endings ("infarkta" is not "infarkt"),
# so inflection-aware matching is needed before phonetic correction is trusted on this language's glossaries.
plural_suffix = ""
verb_suffixes = []

[phonetic.letter_names]
a = "a"
b = "b"
be = "b"
c = "c"
ce = "c"
"č" = "č"
"če" = "č"
"ć" = "ć"
"će" = "ć"
d = "d"
de = "d"
"đ" = "đ"
"đe" = "đ"
e = "e"
f = "f"
ef = "f"
g = "g"
ge = "g"
h = "h"
ha = "h"
i = "i"
j = "j"
je = "j"
k = "k"
ka = "k"
l = "l"
el = "l"
m = "m"
em = "m"
n = "n"
en = "n"
o = "o"
p = "p"
pe = "p"
q = "q"
ku = "q"
r = "r"
er = "r"
s = "s"
es = "s"
"š" = "š"
"eš" = "š"
t = "t"
te = "t"
u = "u"
v = "v"
ve = "v"
w = "w"
x = "x"
iks = "x"
y = "y"
ipsilon = "y"
z = "z"
ze = "z"
"ž" = "ž"
"že" = "ž"

[glossary]
# Wikidata keeps Serbian labels in Cyrillic ("sr") and Latin ("sr-el"); mined terms are normalised to Latin.
wikidata_languages = ["sr", "sr-el", "la"]

[answers]
refusal = "Ne mogu da odgovorim na ovo na osnovu dostupnog konteksta."
output_instruction = "Write every piece of text you produce in Serbian, using the Latin script, even though these instructions are in English. The source material is in Serbian: never translate it into English. Keep [Doc N] tags, speaker labels, JSON keys and any exact reply word these instructions prescribe (such as NO_EVIDENCE) unchanged."
transcript_instruction = "The transcript is in Serbian, written in the Latin script. Never translate it and never switch it to Cyrillic: every word you do not correct must stay exactly as written."

[report]
executive_summary = "Rezime"
not_covered_heading = "Nije pokriveno dostupnim materijalom"
not_covered_item = "- **{title}** — nijedan dokaz u indeksiranom materijalu ne podržava ovaj deo."
references_heading = "Reference"
references_table_header = """| Doc | Izvor | Vremenski raspon | Govornici |
| --- | --- | --- | --- |"""
# A report that cites a document: its rows give a page and section, not a time range
references_table_header_documents = """| Doc | Izvor | Lokacija | Govornici |
| --- | --- | --- | --- |"""
no_sources_cited = "_Nijedan izvor nije citiran._"
unresolved_reference = "_nerazrešeno_"
no_speakers = "—"
# Serbian nouns take three forms after a number, so the templates name counts instead of agreeing with them
generated = "> Izveštaj je generisao Onyx {generated}. Citirani odlomci: {cited}; izvori: {sources}."
coverage_partial = "> Obuhvat: pregledano {swept} od {indexed} indeksiranih izvora."
coverage_all = "> Obuhvat: pregledani su svi indeksirani izvori ({indexed})."
rounds_many = "> Broj krugova pretrage: {rounds} ({mode} režim); kasniji krugovi su ponovo tražili dokaze za odeljke koje prvi prolaz nije mogao da podrži."
rounds_single = "> Pretraga u jednom krugu ({mode} režim)."
scrubber = "> Filter pretrage: {state}."
scrubber_enabled = "uključen"
scrubber_disabled = "isključen"

[report.mode_names]
deep = "dubinski"
exhaustive = "iscrpni"

[documents]
page_label = "str."
pages_label = "str."
line_label = "red"
lines_label = "redovi"
image_label = "slika"
clause_patterns = [
    '^(?:ČLAN|Član|ЧЛАН|Члан)\s+[0-9]+',
    '^(?:ANEKS|Aneks|АНЕКС|Анекс|PRILOG|Prilog|ПРИЛОГ|Прилог)\b',
    # A book's chapters, in both scripts: the number must end the line or be followed by a separator ("GLAVA II. Oluja"),
    # so a wrapped sentence such as "Glava 3 zakona propisuje da" is not taken for a heading.
    '^(?:GLAVA|Glava|ГЛАВА|Глава|POGLAVLJE|Poglavlje|ПОГЛАВЉЕ|Поглавље|DEO|Deo|ДЕО|Део|KNJIGA|Knjiga|КЊИГА|Књига)\s+(?:[0-9]+|[IVXLCDM]+)(?:\s*[.:\-–—]\s*.*)?$',
    '^(?:PROLOG|Prolog|ПРОЛОГ|Пролог|EPILOG|Epilog|ЕПИЛОГ|Епилог|PREDGOVOR|Predgovor|ПРЕДГОВОР|Предговор|UVOD|Uvod|УВОД|Увод)\.?$',
]
# No ocr_rec_model: no single RapidOCR model reads both Serbian scripts (the Cyrillic one lacks č ć đ š ž, the
# Latin one lacks Cyrillic), and on mixed-script pages it lost whole lines. Scanned pages are reported as
# unreadable rather than indexed with guessed text.

# An image's excerpt is written by the vision model and OCR, never by the client: its labels say so.
[images]
description_label = "Slika (mašinski opis)"
ocr_text_label = "Tekst na slici (pročitao OCR)"
unverified_text_label = "Tekst koji je pročitao model za vid (neprovereno)"
withheld_text_note = "Deo teksta na ovoj slici nije mogao pouzdano da se pročita, pa nije uključen."

# Llama 3.2 3B and Qwen2.5-3B don't cover Serbian; Gemma 4 E4B (~140 languages) replaces them.
# whisper-tiny-en is English-only, so the domain scout uses the main Whisper model.
[models]
DISCOVERY_SCOUT_MODEL_PATH = "models/faster-whisper-large-v3"
DISCOVERY_SCOUT_VRAM_REQUIREMENT_MB = 3500.0
DOMAIN_CLASSIFIER_MODEL_PATH = "models/google_gemma-4-E4B-it-Q4_K_M.gguf"
DOMAIN_CLASSIFIER_MODEL_VRAM_REQUIREMENT_MB = 5500.0
CONTEXTUAL_RETRIEVAL_MODEL_PATH = "models/google_gemma-4-E4B-it-Q4_K_M.gguf"
CONTEXTUAL_RETRIEVAL_VRAM_REQUIREMENT_MB = 5500.0
VISUAL_CONTEXT_SYNTHESIS_MODEL_PATH = "models/google_gemma-4-E4B-it-Q4_K_M.gguf"
VISUAL_CONTEXT_SYNTHESIS_VRAM_REQUIREMENT_MB = 5500.0
DOMAIN_PHONETIC_CORRECTION_MODEL_PATH = "models/google_gemma-4-E4B-it-Q4_K_M.gguf"
DOMAIN_PHONETIC_CORRECTION_VRAM_REQUIREMENT_MB = 5500.0
VISUAL_HALLUCINATION_CORRECTION_MODEL_PATH = "models/google_gemma-4-E4B-it-Q4_K_M.gguf"
VISUAL_HALLUCINATION_CORRECTION_VRAM_REQUIREMENT_MB = 5500.0
