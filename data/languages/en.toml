# English language pack.
#
# Every value here reproduces what Onyx hard-coded before language packs existed, so an English appliance
# behaves exactly as it did. Change a rule here, not in the code that reads it.

code = "en"
name = "English"

[transcription]
whisper_language = "en"
accepted_detections = ["en"]
min_detection_probability = 0.5
# Phrases Whisper invents over silence or music in English audio (YouTube outros, subtitle credits)
hallucination_patterns = [
    '(?i)(subscribe|like and subscribe|thank you for watching)',
    '(?i)(amara\.org|subtitles by)',
]

[punctuation]
# fullstop-punctuation-multilingual-base was trained on English, German, French and Italian
source = "model"

[search]
fts_config = "english"

[text]
nltk_stopwords = "english"
citation_joiners = ["and"]

[phonetic]
alphabet = "a-z"
# Voiced and voiceless pairs are the commonest mis-hearings, so each pair shares one symbol
rewrites = [
    ['sch', 'sk'], ['ph', 'f'], ['gh', 'g'], ['ck', 'k'], ['dg', 'j'], ['wr', 'r'], ['kn', 'n'],
    ['c(?=[eiy])', 's'], ['c', 'k'], ['q', 'k'], ['x', 'ks'], ['z', 's'], ['sh', 's'], ['th', 't'],
    ['d', 't'], ['b', 'p'], ['g', 'k'], ['v', 'f'],
]
silent_letters = "aeiouhwy"
head_vowels = "eiouy"
plural_suffix = "s"
verb_suffixes = ["ed", "ing"]

[phonetic.letter_names]
a = "a"
ay = "a"
b = "b"
bee = "b"
be = "b"
c = "c"
see = "c"
sea = "c"
cee = "c"
d = "d"
dee = "d"
e = "e"
ee = "e"
f = "f"
eff = "f"
g = "g"
gee = "g"
h = "h"
aitch = "h"
i = "i"
eye = "i"
j = "j"
jay = "j"
k = "k"
kay = "k"
l = "l"
el = "l"
ell = "l"
m = "m"
em = "m"
n = "n"
en = "n"
o = "o"
oh = "o"
p = "p"
pee = "p"
pea = "p"
q = "q"
cue = "q"
queue = "q"
r = "r"
ar = "r"
are = "r"
s = "s"
ess = "s"
t = "t"
tee = "t"
tea = "t"
u = "u"
you = "u"
v = "v"
vee = "v"
w = "w"
x = "x"
ex = "x"
y = "y"
why = "y"
z = "z"
zed = "z"
zee = "z"

[glossary]
wikidata_languages = ["en", "la"]

[answers]
refusal = "I cannot answer this based on the provided context."

[report]
executive_summary = "Executive summary"
not_covered_heading = "Not covered by the available material"
not_covered_item = "- **{title}** — no evidence in the indexed corpus supported this."
references_heading = "References"
references_table_header = """| Doc | Source | Timespan | Speakers |
| --- | --- | --- | --- |"""
# A report that cites a document: its rows give a page and section, not a time range
references_table_header_documents = """| Doc | Source | Location | Speakers |
| --- | --- | --- | --- |"""
no_sources_cited = "_No sources were cited._"
unresolved_reference = "_unresolved_"
no_speakers = "—"
generated = "> Generated by Onyx on {generated} from {cited} cited {excerpt_noun} across {sources} {source_noun}."
coverage_partial = "> Coverage: swept {swept} of {indexed} indexed sources."
coverage_all = "> Coverage: swept all {indexed} indexed sources."
rounds_many = "> Searched in {rounds} rounds ({mode} mode); later rounds re-asked for sections the first pass could not support."
rounds_single = "> Searched in a single round ({mode} mode)."
scrubber = "> Retrieval scrubber: {state}."
scrubber_enabled = "enabled"
scrubber_disabled = "disabled"

[report.mode_names]
deep = "deep"
exhaustive = "exhaustive"

[report.nouns]
excerpt = ["excerpt", "excerpts"]
source = ["source", "sources"]

[documents]
page_label = "p."
pages_label = "pp."
line_label = "line"
lines_label = "lines"
image_label = "image"
# A line starting with one of these opens a new clause, however the PDF formatted it.
clause_patterns = [
    '^(?:ARTICLE|Article|SECTION|Section|CLAUSE|Clause|SCHEDULE|Schedule|ANNEX|Annex|APPENDIX|Appendix)\s+[0-9IVXLC]+',
    # A book's chapters: the number must end the line or be followed by a separator ("CHAPTER IV. The Storm"),
    # so a wrapped sentence such as "Chapter 3 of the Act provides that" is not taken for a heading.
    '^(?:CHAPTER|Chapter|PART|Part|BOOK|Book)\s+(?:[0-9]+|[IVXLCDM]+|(?i:one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty))(?:\s*[.:\-–—]\s*.*)?$',
    '^(?:PROLOGUE|Prologue|EPILOGUE|Epilogue|PREFACE|Preface|INTRODUCTION|Introduction)\.?$',
]
# PP-OCRv5 "latin" recognition model; its alphabet covers English.
ocr_rec_model = "latin"

# An image's excerpt is written by the vision model and OCR, never by the client: its labels say so.
[images]
description_label = "Image (machine description)"
ocr_text_label = "Text on the image (read by OCR)"
unverified_text_label = "Text the vision model read (not verified)"

# English runs on the default models in app/core/config.py; nothing to override.
[models]
