; Installed by provision.sh as /etc/supervisor/conf.d/onyx.conf.
; The desktop app itself is NOT here: the agent launches it (POST /session), in the language the tester starts in.

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /workspace/pgdata -c listen_addresses=127.0.0.1
user=postgres
priority=10
autorestart=true
; SIGINT is postgres' "fast" shutdown: rolls back open transactions and checkpoints before the container stops.
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/workspace/logs/postgres.log
redirect_stderr=true

[program:xvnc]
; -localhost: only websockify on this box can reach the display; nothing unauthenticated is exposed.
command=/usr/bin/Xvnc :1 -geometry 1600x900 -depth 24 -localhost -rfbport 5901 -SecurityTypes None -AlwaysShared
priority=20
autorestart=true
stdout_logfile=/workspace/logs/xvnc.log
redirect_stderr=true

[program:desktop]
command=/usr/bin/dbus-launch --exit-with-session /usr/bin/startxfce4
environment=DISPLAY=":1",HOME="/root"
priority=30
autorestart=true
startsecs=5
stdout_logfile=/workspace/logs/desktop.log
redirect_stderr=true

[program:novnc]
; The token file maps the gateway's secret token to the display; a request without it gets nothing.
command=/usr/bin/websockify --web /usr/share/novnc --token-plugin TokenFile --token-source /workspace/websockify/tokens 0.0.0.0:6080
priority=40
autorestart=true
stdout_logfile=/workspace/logs/novnc.log
redirect_stderr=true

[program:agent]
command=/bin/bash -c 'set -a; . /workspace/secrets.env; set +a; exec /workspace/agent-venv/bin/uvicorn deploy.instance.agent.app:create_app --factory --host 0.0.0.0 --port 8090'
directory=/workspace/onyx_v3
environment=ONYX_DISPLAY=":1",HOME="/root"
priority=50
autorestart=true
; The agent's own SIGTERM leaves the desktop app running; /shutdown (called by the gateway first) closes it.
stopasgroup=false
stdout_logfile=/workspace/logs/agent.log
redirect_stderr=true
