; Installed by web_deploy/provision/provision.sh as /etc/supervisor/conf.d/onyx-web.conf.
; Vast containers have no systemd; supervisord starts these on every box start (onstart.sh).
;
; The box holds no client data (docs/web_deploy.md, "Where data lives"): the databases and vaults are on the Hetzner
; VPS, reached through the tunnel below. The API and the ingestion worker wait for it before they start.

[program:tunnel]
; Outbound SSH to the VPS: its Postgres at 127.0.0.1:15432 here, this API at 127.0.0.1:18095 there. Restarted on
; any drop; the VPS accepts the key only while the gateway has this box started.
command=/bin/bash /workspace/onyx_v3/web_deploy/provision/box_tunnel.sh
priority=5
autorestart=true
startsecs=5
startretries=1000000
stopwaitsecs=10
stdout_logfile=/workspace/logs/tunnel.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
redirect_stderr=true

[program:tunnel-files]
; A second outbound SSH session, only for the VPS to move one ingestion job's files (box_tunnel_files.sh)
command=/bin/bash /workspace/onyx_v3/web_deploy/provision/box_tunnel_files.sh
priority=6
autorestart=true
startsecs=5
startretries=1000000
stopwaitsecs=10
stdout_logfile=/workspace/logs/tunnel-files.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
redirect_stderr=true

[program:llama-server]
; Loaded first and kept for good: every firm's chats and reports go through these slots.
command=/bin/bash /workspace/onyx_v3/web_deploy/provision/llama_server.sh
priority=20
autorestart=true
startsecs=10
stopwaitsecs=30
stdout_logfile=/workspace/logs/llama-server.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
redirect_stderr=true

[program:api]
; One process: the pinned embedder and reranker are per process; concurrency comes from its threads. Loopback only:
; the gateway reaches it through the tunnel, so the box exposes no port but Vast's own SSH.
command=/bin/bash -c 'set -a; . /workspace/web/api.env; set +a; /workspace/onyx_v3/web_deploy/provision/wait_for_tunnel.sh && exec /workspace/onyx_v3/venv/bin/uvicorn web_deploy.api.app:create_production_app --factory --host 127.0.0.1 --port 8095 --timeout-keep-alive 75'
directory=/workspace/onyx_v3
priority=30
autorestart=true
stopwaitsecs=30
stdout_logfile=/workspace/logs/api.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
redirect_stderr=true

[program:ingest]
; One batch at a time, each in a fresh child process on the ingestion half of the card. Each job's files are pulled
; into scratch and its results pushed back to the VPS (web_deploy/ingest_worker/staging.py).
command=/bin/bash -c 'set -a; . /workspace/web/api.env; set +a; /workspace/onyx_v3/web_deploy/provision/wait_for_tunnel.sh && exec /workspace/onyx_v3/venv/bin/python -m web_deploy.ingest_worker.supervisor'
directory=/workspace/onyx_v3
priority=40
autorestart=true
; The running job's child is terminated and re-queued at the front on the next start
stopasgroup=true
stopwaitsecs=30
stdout_logfile=/workspace/logs/ingest.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
redirect_stderr=true
