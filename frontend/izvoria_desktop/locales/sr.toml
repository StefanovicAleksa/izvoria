# Serbian display catalog: the app's own text in Serbian (Latin script, like the sr language pack).
#
# Keys are the English text exactly as the code writes it; values are what a Serbian reader sees. Translate the
# meaning, not the words: short imperative buttons ("Sačuvaj", "Otvori"), impersonal status words ("Završeno",
# "U toku"), and "sistem" for the appliance. Placeholders in {braces} must be kept as they are. A plural entry
# lists the one / few / many forms (1, 21 / 2-4, 22-24 / everything else).
# tests/utils/test_i18n_catalogs_unit.py fails on a missing, stale or broken entry.

[meta]
code = "sr"
name = "Srpski"
plural = "slavic"

