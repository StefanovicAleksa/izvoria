; Installed by web_deploy/provision/provision.sh as /etc/supervisor/conf.d/onyx-web.conf.
; Vast containers have no systemd; supervisord starts these on every box start (onstart.sh).

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /workspace/pgdata -c listen_addresses=127.0.0.1 -c max_connections=300
user=postgres
priority=10
autorestart=true
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/workspace/logs/postgres.log
redirect_stderr=true

[program:llama-server]
; Loaded first and kept for good: every firm's chats and reports go through these slots.
command=/bin/bash /workspace/onyx_v3/web_deploy/provision/llama_server.sh
priority=20
autorestart=true
startsecs=10
stopwaitsecs=30
stdout_logfile=/workspace/logs/llama-server.log
redirect_stderr=true

[program:api]
; One process: the pinned embedder and reranker are per process; concurrency comes from its threads.
command=/bin/bash -c 'set -a; . /workspace/web/api.env; set +a; exec /workspace/onyx_v3/venv/bin/uvicorn web_deploy.api.app:create_production_app --factory --host 0.0.0.0 --port 8095 --ssl-keyfile /workspace/web/tls/key.pem --ssl-certfile /workspace/web/tls/cert.pem --timeout-keep-alive 75'
directory=/workspace/onyx_v3
priority=30
autorestart=true
stopwaitsecs=30
stdout_logfile=/workspace/logs/api.log
redirect_stderr=true

[program:ingest]
; One batch at a time, each in a fresh child process on the ingestion half of the card.
command=/bin/bash -c 'set -a; . /workspace/web/api.env; set +a; exec /workspace/onyx_v3/venv/bin/python -m web_deploy.ingest_worker.supervisor'
directory=/workspace/onyx_v3
priority=40
autorestart=true
; The running job's child is terminated and re-queued at the front on the next start
stopasgroup=true
stopwaitsecs=30
stdout_logfile=/workspace/logs/ingest.log
redirect_stderr=true

[program:backup]
; Firm databases and vaults to the Storage Box: daily, and after each ingestion. Idles until configured in api.env.
command=/bin/bash -c 'set -a; . /workspace/web/api.env; set +a; exec /workspace/onyx_v3/venv/bin/python -m web_deploy.backup.runner'
directory=/workspace/onyx_v3
priority=50
autorestart=true
stopwaitsecs=30
stdout_logfile=/workspace/logs/backup.log
redirect_stderr=true
