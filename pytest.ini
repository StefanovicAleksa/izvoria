[pytest]
# Add the app directory to python path
pythonpath = . frontend

# LOOK HERE: We added 'integration_tests' to the list
testpaths = tests integration_tests frontend/tests deploy/tests web_deploy/tests

# Markers to categorize tests
markers =
    unit: Fast tests that mock external dependencies
    integration: Slow tests that require Docker
    gui: Desktop tests that need PySide6 and an offscreen QApplication
