# Developer entry point for Alembic. The appliance never reads this file: OnyxEngine.start() migrates through
# app/core/database/service/migrations.py. `env.py` connects to settings.DATABASE_URL, so ENV picks the database:
#   ENV=test venv/bin/alembic revision --autogenerate -m "add foo"   (against an up-to-date, empty db_test)
[alembic]
script_location = app/core/database/data/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
